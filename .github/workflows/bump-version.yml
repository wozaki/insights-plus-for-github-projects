name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version to release (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: ${{ inputs.version }}. Expected format: X.Y.Z"
            exit 1
          fi

      - name: Check tag doesn't already exist
        run: |
          git fetch --tags
          if git tag -l "v${{ inputs.version }}" | grep -q .; then
            echo "Tag v${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Bump package.json version
        run: npm pkg set version="${{ inputs.version }}"

      # main requires the `lint-and-test (22.x)` check, so the bump goes through
      # a PR. Merging it pushes package.json to main, which starts release.yml.
      - name: Commit and push the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v${{ inputs.version }}"
          git commit -am "Bump version to ${{ inputs.version }}"
          git push origin "release/v${{ inputs.version }}"

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh pr create --base main --head "release/v${{ inputs.version }}" \
            --title "Bump version to ${{ inputs.version }}" \
            --body "Merging this PR releases v${{ inputs.version }}: \`release.yml\` tags it, publishes a GitHub Release, and submits the build to the Chrome Web Store.")
          echo "Release PR: $url" >> "$GITHUB_STEP_SUMMARY"

      # A PR opened with GITHUB_TOKEN doesn't fire other workflows' `on:
      # pull_request` triggers, so run the checks on the branch explicitly.
      - name: Run checks on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "release/v${{ inputs.version }}"
          gh workflow run e2e.yml --ref "release/v${{ inputs.version }}"
