# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    # Release PRs opened by bump-version.yml
    authors:
      - github-actions[bot]
  categories:
    - title: Improvements
      labels:
        - "*"
      exclude:
        labels:
          - dependencies
    - title: Dependencies
      labels:
        - dependencies
